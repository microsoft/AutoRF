test_cases:
  - id: "ANT001"
    demand: "Design a high-gain metasurface antenna for 5G applications at 28 GHz with circular polarization"
    categories: ["antenna"]
    tags: ["5G", "high-gain", "circular-polarization"]
    difficulty: "medium"
    description: "Standard 5G antenna design case"
    expected_specs:
      frequency_range: [27.5, 28.5]
      polarization: "CIRCULAR"
      gain_requirement: 15.0
      bandwidth: 0.2
      material: "Rogers4350B"
    expected_template: "circular_patch_array"

  - id: "FIL001"
    demand: "Create a bandpass filter metasurface for X-band satellite communications with 500MHz bandwidth"
    categories: ["filter"]
    tags: ["satellite", "bandpass", "X-band"]
    difficulty: "hard"
    description: "Satellite communication filter design"
    expected_specs:
      frequency_range: [7.5, 8.0]
      bandwidth: 0.5
      insertion_loss: -1.0
      rejection: -20.0
      material: "Rogers5880"
    expected_template: "coupled_resonator_array"

  - id: "POL001"
    demand: "Design a linear-to-circular polarization converter for 2.4 GHz WiFi applications"
    categories: ["polarizer"]
    tags: ["wifi", "polarization-converter"]
    difficulty: "medium"
    description: "WiFi polarization converter"
    expected_specs:
      frequency_range: [2.4, 2.5]
      polarization_ratio: 0.9
      insertion_loss: -0.5
      material: "FR4"
    expected_template: "meander_line_polarizer"